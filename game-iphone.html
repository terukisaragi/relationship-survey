let mobileMusic=null, musicVersion=0, requestedBgm=false;
function getMobileMusic(){
  if(mobileMusic)return mobileMusic;
  mobileMusic=document.createElement('audio');
  mobileMusic.preload='auto';mobileMusic.loop=true;mobileMusic.volume=.78;
  mobileMusic.playsInline=true;mobileMusic.setAttribute('playsinline','');
  mobileMusic.addEventListener('playing',()=>{if(sound){soundBtn.textContent='♫ BGM ON';soundBtn.title='音乐正在播放'}});
  mobileMusic.addEventListener('pause',()=>{if(sound&&document.visibilityState==='visible'){soundBtn.textContent='♫ BGM PAUSED · 点我重试'}});
  mobileMusic.addEventListener('error',()=>{if(sound){soundBtn.textContent='♫ AUDIO ERROR · 点我重试'}});
  document.body.appendChild(mobileMusic);
  return mobileMusic;
}
function startBgm(){
  if(!sound)return;
  const player=getMobileMusic(), track=desiredTrack();
  ++musicVersion;
  if(musicTrack!==track||!player.src){musicTrack=track;player.src=embeddedMusic[track];player.load();}
  const version=musicVersion;
  soundBtn.textContent='♫ BGM STARTING…';
  if(!musicScheduler)musicScheduler=setInterval(musicTick,350);
  try{
    const promise=player.play();
    if(promise&&typeof promise.then==='function')promise.then(()=>{
      if(version!==musicVersion||!sound)return;
      soundBtn.textContent='♫ BGM ON';
    }).catch(err=>{
      if(version!==musicVersion||!sound)return;
      soundBtn.textContent='♫ BGM BLOCKED · 再点一次';
      soundBtn.title='iPhone 阻止自动播放：'+(err?.name||'unknown');
    });
    else soundBtn.textContent='♫ BGM ON';
  }catch(e){soundBtn.textContent='♫ BGM BLOCKED · 再点一次';}
}
function musicTick(){
  if(!sound||!mobileMusic)return;
  const wanted=desiredTrack();if(wanted!==musicTrack){
    musicTrack=wanted;mobileMusic.src=embeddedMusic[wanted];mobileMusic.load();
    const p=mobileMusic.play();if(p&&p.catch)p.catch(()=>{soundBtn.textContent='♫ BGM PAUSED · 点我恢复'});
  }
}
function stopBgm(){
  ++musicVersion;
  if(musicScheduler){clearInterval(musicScheduler);musicScheduler=null;}
  if(mobileMusic){mobileMusic.pause();mobileMusic.currentTime=0;}
  if(audio&&musicMaster){try{musicMaster.disconnect()}catch(e){}musicMaster=null;}
  musicTrack='';
}

function jump(id){clearFx();clearInterval(state.timer);let n=nodes[id];if(!n)return title();state.mode='story';state.node=id;anomaly(id);state.log.push({who:n.who,text:n.text});place.textContent=n.loc||'门后';hint.textContent='触碰画面调查物品 · 点击对话推进';screen.innerHTML='<section class="dialog" id="dialog"><div class="speaker">'+esc(n.who)+'</div><div class="copy" id="copy"></div><div id="actions"></div></section>';let copy=document.getElementById('copy'),i=0;state.typing=true;function finish(){clearInterval(state.timer);copy.textContent=n.text;state.typing=false;let area=document.getElementById('actions');if(n.choices){area.innerHTML='<div class="options">'+n.choices.map((c,k)=>'<button class="option" data-action="choice" data-index="'+k+'">▶ '+esc(c.label)+'</button>').join('')+'</div>'}else if(n.end){area.innerHTML='<button class="option" data-action="end" data-id="'+n.end+'">▶ 查看结局</button>'}else area.innerHTML='<div class="next">▼ 轻触对话框继续</div>'}state.finish=finish;state.timer=setInterval(()=>{i=Math.min(i+2,n.text.length);copy.textContent=n.text.slice(0,i);if(i>=n.text.length)finish()},23)}
function advance(){if(freeze||state.mode!=='story')return;let n=nodes[state.node];if(state.typing)return state.finish();if(n.next)jump(n.next);else if(n.end)end(n.end)}
function end(id){clearFx();clearInterval(state.timer);root.classList.toggle('anomaly-3',fxEnabled&&id==='falsehe');state.mode='end';state.ending=id;if(!save.unlocked.includes(id)){save.unlocked.push(id);persist()}place.textContent=ends[id].tag;hint.textContent='ENDING DISCOVERED · '+save.unlocked.length+'/5';let e=ends[id];screen.innerHTML='<section class="center"><div class="eng">'+esc(e.tag)+'</div><h2 class="ending-title">'+esc(e.title)+'</h2><p class="ending-text">'+esc(e.desc)+'</p>'+(id==='be'?'<button class="menu-button" data-action="secret">……等等，屏幕没有熄灭</button>':'')+'<button class="menu-button" data-action="start">▶ 再玩一次</button><button class="menu-button" data-action="records">◇ 结局档案</button><div class="help">'+esc(e.hint)+'</div></section>'}
function records(){state.prev=state.mode;state.mode='records';place.textContent='エンディング · 结局图鉴';hint.textContent='收集 '+save.unlocked.length+' / 5';screen.innerHTML='<section class="center"><h2 class="bigjp" style="font-size:23px">エンディング</h2><div class="records">'+Object.entries(ends).map(([id,e],i)=>'<div class="record">'+(save.unlocked.includes(id)?'✦ '+esc(e.title):'◇ ？？？')+' <small> / '+(i+1).toString().padStart(2,'0')+'</small></div>').join('')+'</div><button class="menu-button" data-action="home">↩ 返回标题</button></section>'}
function history(){let html='<h2>☷ 对话记录</h2><div class="log">'+state.log.slice(-20).map(l=>'<div><b>'+esc(l.who)+'</b><p>'+esc(l.text).replace(/\n/g,'<br>')+'</p></div>').join('')+'</div><button class="menu-button" data-action="close">关闭</button>';let o=document.createElement('div');o.className='overlay';o.id='overlay';o.innerHTML='<div class="window">'+html+'</div>';root.appendChild(o)}
function investigate(){if(state.mode!=='story')return;let n=nodes[state.node];let msg=(n.bg==='station'?'你蹲下来摸了摸脚边的石砖。夜里很安静，手机却还亮着。':n.bg==='room'?'你盯着门把手。金属冰凉，门没有上锁。':'有什么东西在暗处移动。它似乎正在等你决定下一步。');let o=document.createElement('div');o.className='overlay';o.id='overlay';o.innerHTML='<div class="window"><h2>✧ 调查</h2><p style="line-height:1.9">'+msg+'</p><button class="menu-button" data-action="close">返回</button></div>';root.appendChild(o)}

document.addEventListener('click',e=>{if(freeze)return;let b=e.target.closest('[data-action]');if(!b){if(e.target.closest('#dialog'))advance();return}let a=b.dataset.action;tone();if(a==='start')start();if(a==='home')title();if(a==='end')end(b.dataset.id);if(a==='secret')jump('secret1');if(a==='choice'){let c=nodes[state.node].choices[+b.dataset.index];if(c){if(['flight','open'].includes(c.next))pulse();jump(c.next)}}if(a==='records')records();if(a==='history')history();if(a==='close')document.getElementById('overlay')?.remove()});cvs.addEventListener('click',investigate);soundBtn.addEventListener('click',()=>{if(sound && mobileMusic && mobileMusic.paused){startBgm();return}sound=!sound;if(sound){startBgm()}else{stopBgm();soundBtn.textContent='♫ BGM OFF'}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sound&&mobileMusic&&mobileMusic.paused)soundBtn.textContent='♫ BGM PAUSED · 点我恢复';});fxBtn.addEventListener('click',()=>{fxEnabled=!fxEnabled;fxBtn.textContent=fxEnabled?'◈ FX ON':'◈ FX OFF';try{localStorage.setItem('behind_door_fx',fxEnabled?'on':'off')}catch(e){}clearFx();if(state.mode==='story')anomaly(state.node);else root.classList.remove('anomaly-1','anomaly-2','anomaly-3')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('overlay')?.remove();clearFx();return}if((e.key===' '||e.key==='Enter')&&state.mode==='story'&&e.target.tagName!=='BUTTON'){e.preventDefault();advance()}});title();
})();</script></body></html>
