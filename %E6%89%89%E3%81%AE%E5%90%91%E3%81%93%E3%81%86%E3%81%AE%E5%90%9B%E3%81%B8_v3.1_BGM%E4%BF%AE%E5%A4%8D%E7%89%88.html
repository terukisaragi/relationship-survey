// Original, self-contained, scene-responsive chiptune soundtrack (no fetched audio files).
let musicMaster=null,musicStep=0,musicNext=0,musicTrack='',musicScheduler=null;
const STEP=.245; // eighth-note duration at ~122 BPM
const musicTracks={
 moon:{lead:'A4 - E5 D5 C5 - E5 A4 - | G4 - C5 B4 A4 - E4 - | F4 - A4 C5 E5 D5 C5 - | E4 - G4 B4 C5 - A4 -',bass:'A2 - - - F2 - - - | C3 - - - E2 - - - | F2 - - - C3 - - - | E2 - - - A2 - - -',chord:'A3 C4 E4 | F3 A3 C4 | C4 E4 G4 | E3 G3 B3',wave:'triangle'},
 hall:{lead:'E5 - D5 - B4 - A4 - | G4 - - B4 A4 - E4 - | F4 - A4 - G4 - E4 - | D4 - E4 - B4 - - -',bass:'E2 - - - C3 - - - | G2 - - - B2 - - - | D2 - - - A2 - - - | B1 - - - E2 - - -',chord:'E3 G3 B3 | C3 E3 G3 | D3 F3 A3 | B2 D3 F3',wave:'sine'},
 void:{lead:'A4 - Ab4 - E5 - Eb5 - | C5 - - Bb4 - F#4 - | A4 - G#4 - C5 - B4 - | F4 - E4 - Bb4 - - -',bass:'A1 - - Eb2 - - - | F#1 - - C2 - - - | G1 - - Db2 - - - | F1 - - B1 - - -',chord:'A2 C3 Eb3 | F#2 A2 C3 | G2 Bb2 Db3 | F2 Ab2 B2',wave:'square'},
 dawn:{lead:'C5 - E5 G5 - E5 D5 - | C5 - A4 - G4 - E4 - | F4 - A4 C5 - D5 E5 - | G5 - E5 D5 C5 - - -',bass:'C3 - - - A2 - - - | F2 - - - G2 - - - | F2 - - - G2 - - - | C3 - - - C3 - - -',chord:'C4 E4 G4 | A3 C4 E4 | F3 A3 C4 | G3 B3 D4',wave:'triangle'}
};
function parseNotes(s){return s.replace(/\|/g,' ').trim().split(/\s+/)}
for(const t of Object.values(musicTracks)){t.m=parseNotes(t.lead);t.b=parseNotes(t.bass);t.c=t.chord.split('|').map(v=>parseNotes(v));}
const tones={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11};
function hz(note){if(!note||note==='-')return 0;let m=/^([A-G](?:#|b)?)(\d)$/.exec(note);if(!m)return 0;let midi=12*(Number(m[2])+1)+tones[m[1]];return 440*Math.pow(2,(midi-69)/12)}
function initAudio(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;audio=audio||new A();if(audio.state==='suspended')audio.resume();if(!musicMaster){musicMaster=audio.createGain();musicMaster.gain.value=.22;musicMaster.connect(audio.destination)}return audio}catch(e){return null}}
function chip(freq,when,duration,volume=.06,type='triangle',attack=.012){if(!audio||!musicMaster||!freq)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.00001,when);g.gain.linearRampToValueAtTime(volume,when+attack);g.gain.exponentialRampToValueAtTime(.00001,when+duration);o.connect(g);g.connect(musicMaster);o.start(when);o.stop(when+duration+.02)}
function soundNote(freq,duration=.12,volume=.017,type='square'){if(!sound)return;const a=initAudio();if(a)chip(freq,a.currentTime+.005,duration,volume,type)}
function desiredTrack(){if(state.mode==='title'||state.mode==='records')return 'moon';if(state.mode==='end')return ['truehe','openhe','break'].includes(state.ending)?'dawn':state.ending==='falsehe'?'void':'hall';const bg=nodes[state.node]?.bg;if(['horror','void'].includes(bg))return 'void';if(bg==='room')return 'hall';if(bg==='light')return 'dawn';return 'moon'}
function startBgm(){if(!sound)return;stopBgm();const a=initAudio();if(!a||!musicMaster){soundBtn.textContent='♫ AUDIO UNSUPPORTED';return}musicTrack=desiredTrack();musicStep=0;musicNext=a.currentTime+.065;musicScheduler=setInterval(musicTick,65);musicTick()}
function musicTick(){if(!sound||!audio||!musicMaster)return;const nextTrack=desiredTrack();if(nextTrack!==musicTrack){musicTrack=nextTrack;musicStep=0;musicNext=audio.currentTime+.11}const tr=musicTracks[musicTrack];while(musicNext<audio.currentTime+.20){const i=musicStep%32,lead=hz(tr.m[i%tr.m.length]),bass=hz(tr.b[i%tr.b.length]);if(lead)chip(lead,musicNext,STEP*.86,musicTrack==='void'?.027:.040,tr.wave);if(bass&&i%2===0)chip(bass,musicNext,STEP*1.85,.048,'triangle');if(i%8===0){const chord=tr.c[Math.floor(i/8)%tr.c.length];chord.forEach((n,j)=>chip(hz(n),musicNext+j*.018,STEP*6,.011,'sine',.08))}if(i%8===4&&musicTrack==='void')chip(55,musicNext,.095,.022,'sawtooth');musicStep++;musicNext+=STEP}}
function stopBgm(){if(musicScheduler){clearInterval(musicScheduler);musicScheduler=null}if(audio&&musicMaster){musicMaster.gain.cancelScheduledValues(audio.currentTime);musicMaster.gain.setTargetAtTime(.00001,audio.currentTime,.045);try{musicMaster.disconnect()}catch(e){}musicMaster=null}musicTrack=''}

function title(){clearFx();root.classList.remove('anomaly-1','anomaly-2','anomaly-3');clearInterval(state.timer);state.mode='title';state.node=null;place.textContent='旧楼前 · 05:29';hint.textContent='这是一个会改变结局的故事';screen.innerHTML='<section class="center"><div class="titlemoon">☾</div><h1 class="bigjp">扉の向こうの君へ</h1><div class="eng">THE ONE BEHIND THE DOOR</div><div class="sub">门后仍是你 · 复古像素互动短篇</div><button class="menu-button" data-action="start">▶ はじめから · 开始</button><button class="menu-button" data-action="records">◇ エンディング · 结局 '+save.unlocked.length+'/5</button><div class="help">原创 8-bit 配乐（♫ BGM 开启） · 五个结局<br>心理惊悚 · 短暂闪屏（可关 FX） · 不含血腥画面</div></section>'}

function jump(id){clearFx();clearInterval(state.timer);let n=nodes[id];if(!n)return title();state.mode='story';state.node=id;anomaly(id);state.log.push({who:n.who,text:n.text});place.textContent=n.loc||'门后';hint.textContent='触碰画面调查物品 · 点击对话推进';screen.innerHTML='<section class="dialog" id="dialog"><div class="speaker">'+esc(n.who)+'</div><div class="copy" id="copy"></div><div id="actions"></div></section>';let copy=document.getElementById('copy'),i=0;state.typing=true;function finish(){clearInterval(state.timer);copy.textContent=n.text;state.typing=false;let area=document.getElementById('actions');if(n.choices){area.innerHTML='<div class="options">'+n.choices.map((c,k)=>'<button class="option" data-action="choice" data-index="'+k+'">▶ '+esc(c.label)+'</button>').join('')+'</div>'}else if(n.end){area.innerHTML='<button class="option" data-action="end" data-id="'+n.end+'">▶ 查看结局</button>'}else area.innerHTML='<div class="next">▼ 轻触对话框继续</div>'}state.finish=finish;state.timer=setInterval(()=>{i=Math.min(i+2,n.text.length);copy.textContent=n.text.slice(0,i);if(i>=n.text.length)finish()},23)}
